name: Implement v2 server tool visibility

on:
  push:
    branches:
      - ui/v2-server-tool-visibility

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement server tool visibility UI'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v2-server-tool-visibility
      - name: Patch server tool visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # Persist per-server hidden tool names as routing-relevant configuration.
          replace('internal/v2config/types.go',
              '\tLogging     ServerLoggingConfig `json:"logging"`\n}',
              '\tLogging        ServerLoggingConfig   `json:"logging"`\n\tToolVisibility ToolVisibilityConfig `json:"tool_visibility,omitempty"`\n}')
          replace('internal/v2config/types.go',
              'type ServerLoggingConfig struct {\n\tCaptureLevelOverride *string `json:"capture_level_override,omitempty"`\n}\n',
              '''type ServerLoggingConfig struct {\n\tCaptureLevelOverride *string `json:"capture_level_override,omitempty"`\n}\n\ntype ToolVisibilityConfig struct {\n\tHidden []string `json:"hidden,omitempty"`\n}\n\nfunc (e ServerEntry) ToolExposed(name string) bool {\n\tfor _, hidden := range e.ToolVisibility.Hidden {\n\t\tif hidden == name {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n''')

          replace('internal/v2config/validate.go',
              '\tfor k, v := range e.Environment.SecretRefs {\n\t\tif !envNamePattern.MatchString(k) {\n\t\t\treturn fmt.Errorf("invalid environment secret name %q", k)\n\t\t}\n\t\tif err := validateSecretRef(v); err != nil {\n\t\t\treturn fmt.Errorf("environment secret %q: %w", k, err)\n\t\t}\n\t}\n\treturn validateTransport(e.Transport)\n',
              '''\tfor k, v := range e.Environment.SecretRefs {\n\t\tif !envNamePattern.MatchString(k) {\n\t\t\treturn fmt.Errorf("invalid environment secret name %q", k)\n\t\t}\n\t\tif err := validateSecretRef(v); err != nil {\n\t\t\treturn fmt.Errorf("environment secret %q: %w", k, err)\n\t\t}\n\t}\n\tseenHiddenTools := make(map[string]struct{}, len(e.ToolVisibility.Hidden))\n\tfor _, name := range e.ToolVisibility.Hidden {\n\t\tif strings.TrimSpace(name) == "" || strings.TrimSpace(name) != name {\n\t\t\treturn errors.New("tool_visibility.hidden names must be non-empty and trimmed")\n\t\t}\n\t\tif len(name) > 512 {\n\t\t\treturn errors.New("tool_visibility.hidden names may not exceed 512 bytes")\n\t\t}\n\t\tif _, exists := seenHiddenTools[name]; exists {\n\t\t\treturn fmt.Errorf("duplicate hidden tool %q", name)\n\t\t}\n\t\tseenHiddenTools[name] = struct{}{}\n\t}\n\treturn validateTransport(e.Transport)\n''')

          # Hidden tools do not enter a new routing generation.
          replace('internal/indexing/service.go',
              '\t\tfor _, tool := range snapshot.Tools {\n\t\t\tfingerprint, _, err := toolcontract.FingerprintTool(tool)\n',
              '\t\tfor _, tool := range snapshot.Tools {\n\t\t\tif !entry.ToolExposed(tool.Name) {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tfingerprint, _, err := toolcontract.FingerprintTool(tool)\n')

          # Keep the last discovered tool snapshot with lifecycle state so stopped
          # Managed/Manual servers still show the most recent count.
          replace('internal/routedlifecycle/service.go',
              '\tActiveCallCount int                 `json:"active_call_count"`\n',
              '\tActiveCallCount int                 `json:"active_call_count"`\n\tToolCount       int                 `json:"tool_count"`\n')
          replace('internal/routedlifecycle/service.go',
              '\tentry           v2config.ServerEntry\n\tsession         RuntimeSession\n\tactive          int\n',
              '\tentry           v2config.ServerEntry\n\tsession         RuntimeSession\n\ttools           downstream.ToolSnapshot\n\tactive          int\n')
          replace('internal/routedlifecycle/service.go',
              '\t\tActiveCallCount: st.active,\n',
              '\t\tActiveCallCount: st.active,\n\t\tToolCount:       len(st.tools.Tools),\n')
          replace('internal/routedlifecycle/service.go',
              '\tst.session = connected\n\tst.generation++\n',
              '\tst.session = connected\n\tst.tools = connected.InitialTools().Clone()\n\tst.generation++\n',
              count=3)
          replace('internal/routedlifecycle/service.go',
              'func (s *Service) Start(ctx context.Context, serverID string) (Snapshot, error) {\n',
              '''func (s *Service) KnownTools(serverID string) (downstream.ToolSnapshot, error) {\n\tst, err := s.lookup(serverID)\n\tif err != nil {\n\t\treturn downstream.ToolSnapshot{}, err\n\t}\n\tst.mu.Lock()\n\tdefer st.mu.Unlock()\n\tif st.deleted {\n\t\treturn downstream.ToolSnapshot{}, lifecycleError("server_not_found", ErrServerNotFound, false)\n\t}\n\treturn st.tools.Clone(), nil\n}\n\nfunc (s *Service) Start(ctx context.Context, serverID string) (Snapshot, error) {\n''')

          # Native facade: merge live known tools, active-catalog tools, and hidden
          # configuration names. Live snapshots win over older catalog membership.
          replace('internal/app/v2_app.go',
              'func (a *V2App) Snapshots() []routedlifecycle.Snapshot {\n\tif a == nil || a.lifecycle == nil {\n\t\treturn nil\n\t}\n\treturn a.lifecycle.Snapshots()\n}\n',
              '''func (a *V2App) Snapshots() []routedlifecycle.Snapshot {\n\tif a == nil || a.lifecycle == nil {\n\t\treturn nil\n\t}\n\treturn a.lifecycle.Snapshots()\n}\n\nfunc (a *V2App) KnownServerToolNames(ctx context.Context, serverID string) ([]string, error) {\n\tif ctx == nil {\n\t\tctx = context.Background()\n\t}\n\tset := make(map[string]struct{})\n\tlive := false\n\tif a != nil && a.lifecycle != nil {\n\t\tsnapshot, err := a.lifecycle.KnownTools(serverID)\n\t\tif err == nil && len(snapshot.Tools) > 0 {\n\t\t\tlive = true\n\t\t\tfor _, tool := range snapshot.Tools {\n\t\t\t\tif tool != nil && strings.TrimSpace(tool.Name) != "" {\n\t\t\t\t\tset[tool.Name] = struct{}{}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\tif !live && a != nil && a.catalog != nil {\n\t\tif generation, err := a.catalog.ActiveGeneration(ctx); err == nil {\n\t\t\trows, queryErr := a.catalog.DB().QueryContext(ctx, `SELECT tool_name FROM source_tools WHERE generation_id = ? AND server_id = ? ORDER BY tool_name`, generation.ID, serverID)\n\t\t\tif queryErr != nil {\n\t\t\t\treturn nil, queryErr\n\t\t\t}\n\t\t\tfor rows.Next() {\n\t\t\t\tvar name string\n\t\t\t\tif err := rows.Scan(&name); err != nil {\n\t\t\t\t\trows.Close()\n\t\t\t\t\treturn nil, err\n\t\t\t\t}\n\t\t\t\tset[name] = struct{}{}\n\t\t\t}\n\t\t\tif err := rows.Err(); err != nil {\n\t\t\t\trows.Close()\n\t\t\t\treturn nil, err\n\t\t\t}\n\t\t\trows.Close()\n\t\t}\n\t}\n\tfor _, entry := range a.Entries() {\n\t\tif entry.ID != serverID {\n\t\t\tcontinue\n\t\t}\n\t\tfor _, name := range entry.ToolVisibility.Hidden {\n\t\t\tset[name] = struct{}{}\n\t\t}\n\t\tbreak\n\t}\n\tnames := make([]string, 0, len(set))\n\tfor name := range set {\n\t\tnames = append(names, name)\n\t}\n\tsort.Strings(names)\n\treturn names, nil\n}\n\nfunc (a *V2App) KnownServerToolCounts(ctx context.Context) map[string]int {\n\tcounts := make(map[string]int)\n\tfor _, entry := range a.Entries() {\n\t\tnames, err := a.KnownServerToolNames(ctx, entry.ID)\n\t\tif err == nil {\n\t\t\tcounts[entry.ID] = len(names)\n\t\t}\n\t}\n\treturn counts\n}\n''')

          # Add the tools button to each compact server row and replace active
          # lease text with the number of discovered tools.
          replace('cmd/tunnel-manager/desktop_v2_gio.go',
              '\tedit    widget.Clickable\n\tremove  widget.Clickable\n',
              '\tedit    widget.Clickable\n\ttools   widget.Clickable\n\tremove  widget.Clickable\n')
          replace('cmd/tunnel-manager/desktop_v2_pages.go',
              'func v2ServersPage(u *v2DesktopUI, gtx layout.Context) layout.Dimensions {\n\tif v2ServerEditorActive() {\n',
              'func v2ServersPage(u *v2DesktopUI, gtx layout.Context) layout.Dimensions {\n\tif v2ToolVisibilityEditorActive() {\n\t\treturn v2ToolVisibilityEditorPage(u, gtx)\n\t}\n\tif v2ServerEditorActive() {\n')
          replace('cmd/tunnel-manager/desktop_v2_pages.go',
              '\tmanager := u.core.ManagerConfig()\n\tsnapshots := make(map[string]routedlifecycle.Snapshot)\n',
              '\tmanager := u.core.ManagerConfig()\n\ttoolCounts := u.core.KnownServerToolCounts(context.Background())\n\tsnapshots := make(map[string]routedlifecycle.Snapshot)\n')
          replace('cmd/tunnel-manager/desktop_v2_pages.go',
              '\t\t\tfor actions.edit.Clicked(gtx) {\n\t\t\t\topenExistingV2ServerEditor(entry)\n\t\t\t\tu.invalidate()\n\t\t\t}\n',
              '''\t\t\tfor actions.edit.Clicked(gtx) {\n\t\t\t\topenExistingV2ServerEditor(entry)\n\t\t\t\tu.invalidate()\n\t\t\t}\n\t\t\tfor actions.tools.Clicked(gtx) {\n\t\t\t\tnames, err := u.core.KnownServerToolNames(context.Background(), entry.ID)\n\t\t\t\tif err != nil {\n\t\t\t\t\tu.setMessage("loading tools for "+entry.Name+": "+err.Error())\n\t\t\t\t} else {\n\t\t\t\t\topenV2ToolVisibilityEditor(entry, names)\n\t\t\t\t\tu.invalidate()\n\t\t\t\t}\n\t\t\t}\n''')
          replace('cmd/tunnel-manager/desktop_v2_pages.go',
              'return layout.Inset{Top: unit.Dp(3)}.Layout(gtx, faintCaption(u.th, fmt.Sprintf("%s · active leases %d · %s", entry.Transport.Type, snapshot.ActiveCallCount, entry.ID)))',
              'return layout.Inset{Top: unit.Dp(3)}.Layout(gtx, faintCaption(u.th, fmt.Sprintf("%s · %d tools · %s", entry.Transport.Type, toolCounts[entry.ID], entry.ID)))')
          replace('cmd/tunnel-manager/desktop_v2_pages.go',
              '''\t\t\t\t\t\tchildren = append(children,\n\t\t\t\t\t\t\tlayout.Rigid(func(gtx layout.Context) layout.Dimensions {\n\t\t\t\t\t\t\t\treturn layout.Inset{Left: unit.Dp(4)}.Layout(gtx, v2ServerIconButton(u.th, &actions.edit, "✎"))\n\t\t\t\t\t\t\t}),\n''',
              '''\t\t\t\t\t\tchildren = append(children,\n\t\t\t\t\t\t\tlayout.Rigid(func(gtx layout.Context) layout.Dimensions {\n\t\t\t\t\t\t\t\treturn layout.Inset{Left: unit.Dp(4)}.Layout(gtx, v2ServerIconButton(u.th, &actions.tools, "≡"))\n\t\t\t\t\t\t\t}),\n\t\t\t\t\t\t\tlayout.Rigid(func(gtx layout.Context) layout.Dimensions {\n\t\t\t\t\t\t\t\treturn layout.Inset{Left: unit.Dp(4)}.Layout(gtx, v2ServerIconButton(u.th, &actions.edit, "✎"))\n\t\t\t\t\t\t\t}),\n''')

          PY

          cat > cmd/tunnel-manager/desktop_v2_tool_visibility.go <<'EOF'
          //go:build !nogui

          package main

          import (
          	"context"
          	"fmt"
          	"sort"

          	"gioui.org/layout"
          	"gioui.org/unit"
          	"gioui.org/widget"
          	"gioui.org/widget/material"

          	"github.com/madesai98/GPT-Tunnel-Manager/internal/v2config"
          )

          var v2ToolVisibilityEditorState struct {
          	active     bool
          	serverID   string
          	serverName string
          	tools      []string
          	hidden     map[string]bool
          	toggles    map[string]*widget.Clickable
          	save       widget.Clickable
          	cancel     widget.Clickable
          	list       widget.List
          }

          func initV2ToolVisibilityEditor() {
          	if v2ToolVisibilityEditorState.hidden == nil {
          		v2ToolVisibilityEditorState.hidden = make(map[string]bool)
          	}
          	if v2ToolVisibilityEditorState.toggles == nil {
          		v2ToolVisibilityEditorState.toggles = make(map[string]*widget.Clickable)
          	}
          	v2ToolVisibilityEditorState.list.List.Axis = layout.Vertical
          }

          func v2ToolVisibilityEditorActive() bool {
          	initV2ToolVisibilityEditor()
          	return v2ToolVisibilityEditorState.active
          }

          func openV2ToolVisibilityEditor(entry v2config.ServerEntry, names []string) {
          	initV2ToolVisibilityEditor()
          	set := make(map[string]struct{}, len(names)+len(entry.ToolVisibility.Hidden))
          	for _, name := range names {
          		if name != "" {
          			set[name] = struct{}{}
          		}
          	}
          	for _, name := range entry.ToolVisibility.Hidden {
          		set[name] = struct{}{}
          	}
          	tools := make([]string, 0, len(set))
          	for name := range set {
          		tools = append(tools, name)
          	}
          	sort.Strings(tools)

          	v2ToolVisibilityEditorState.active = true
          	v2ToolVisibilityEditorState.serverID = entry.ID
          	v2ToolVisibilityEditorState.serverName = entry.Name
          	v2ToolVisibilityEditorState.tools = tools
          	v2ToolVisibilityEditorState.hidden = make(map[string]bool, len(entry.ToolVisibility.Hidden))
          	for _, name := range entry.ToolVisibility.Hidden {
          		v2ToolVisibilityEditorState.hidden[name] = true
          	}
          	v2ToolVisibilityEditorState.toggles = make(map[string]*widget.Clickable, len(tools))
          	v2ToolVisibilityEditorState.list.Position = layout.Position{}
          }

          func closeV2ToolVisibilityEditor() {
          	v2ToolVisibilityEditorState.active = false
          	v2ToolVisibilityEditorState.serverID = ""
          	v2ToolVisibilityEditorState.serverName = ""
          	v2ToolVisibilityEditorState.tools = nil
          }

          func v2ToolVisibilityEditorPage(u *v2DesktopUI, gtx layout.Context) layout.Dimensions {
          	initV2ToolVisibilityEditor()
          	for v2ToolVisibilityEditorState.cancel.Clicked(gtx) {
          		closeV2ToolVisibilityEditor()
          		u.invalidate()
          	}
          	for v2ToolVisibilityEditorState.save.Clicked(gtx) {
          		var entry v2config.ServerEntry
          		found := false
          		for _, candidate := range u.core.Entries() {
          			if candidate.ID == v2ToolVisibilityEditorState.serverID {
          				entry = candidate
          				found = true
          				break
          			}
          		}
          		if !found {
          			u.setMessage("server no longer exists")
          			closeV2ToolVisibilityEditor()
          			break
          		}
          		hidden := make([]string, 0)
          		for _, name := range v2ToolVisibilityEditorState.tools {
          			if v2ToolVisibilityEditorState.hidden[name] {
          				hidden = append(hidden, name)
          			}
          		}
          		sort.Strings(hidden)
          		entry.ToolVisibility.Hidden = hidden
          		label := "saving tool visibility for " + entry.Name
          		closeV2ToolVisibilityEditor()
          		u.async(label, func() error {
          			return u.core.SaveServer(context.Background(), entry)
          		})
          	}

          	exposed := 0
          	for _, name := range v2ToolVisibilityEditorState.tools {
          		if !v2ToolVisibilityEditorState.hidden[name] {
          			exposed++
          		}
          	}
          	hiddenCount := len(v2ToolVisibilityEditorState.tools) - exposed

          	return layout.Flex{Axis: layout.Vertical}.Layout(gtx,
          		layout.Rigid(func(gtx layout.Context) layout.Dimensions {
          			return layout.Flex{Alignment: layout.Middle}.Layout(gtx,
          				layout.Flexed(1, func(gtx layout.Context) layout.Dimensions {
          					return layout.Flex{Axis: layout.Vertical}.Layout(gtx,
          						layout.Rigid(sectionTitle(u.th, "Tool Exposure · "+v2ToolVisibilityEditorState.serverName)),
          						layout.Rigid(func(gtx layout.Context) layout.Dimensions {
          							return layout.Inset{Top: unit.Dp(4)}.Layout(gtx, mutedCaption(u.th, fmt.Sprintf("%d tools found · %d exposed · %d hidden", len(v2ToolVisibilityEditorState.tools), exposed, hiddenCount)))
          						}),
          					)
          				}),
          				layout.Rigid(secondaryButton(u.th, &v2ToolVisibilityEditorState.cancel, "Cancel")),
          				layout.Rigid(func(gtx layout.Context) layout.Dimensions { return layout.Spacer{Width: unit.Dp(8)}.Layout(gtx) }),
          				layout.Rigid(primaryButton(u.th, &v2ToolVisibilityEditorState.save, "Save")),
          			)
          		}),
          		layout.Rigid(func(gtx layout.Context) layout.Dimensions { return layout.Spacer{Height: unit.Dp(12)}.Layout(gtx) }),
          		layout.Flexed(1, func(gtx layout.Context) layout.Dimensions {
          			if len(v2ToolVisibilityEditorState.tools) == 0 {
          				return compactCard(func(gtx layout.Context) layout.Dimensions {
          					return mutedCaption(u.th, "No tools have been discovered for this server yet. Start it once or refresh the index, then reopen this editor.")(gtx)
          				})(gtx)
          			}
          			return material.List(u.th, &v2ToolVisibilityEditorState.list).Layout(gtx, len(v2ToolVisibilityEditorState.tools), func(gtx layout.Context, index int) layout.Dimensions {
          				name := v2ToolVisibilityEditorState.tools[index]
          				button := v2ToolVisibilityEditorState.toggles[name]
          				if button == nil {
          					button = new(widget.Clickable)
          					v2ToolVisibilityEditorState.toggles[name] = button
          				}
          				for button.Clicked(gtx) {
          					v2ToolVisibilityEditorState.hidden[name] = !v2ToolVisibilityEditorState.hidden[name]
          				}
          				exposed := !v2ToolVisibilityEditorState.hidden[name]
          				state, bg, fg := "EXPOSED", uiSuccessSoft, uiSuccess
          				if !exposed {
          					state, bg, fg = "HIDDEN", uiSurfaceRaised, uiMuted
          				}
          				return layout.Inset{Bottom: unit.Dp(7)}.Layout(gtx, compactCard(func(gtx layout.Context) layout.Dimensions {
          					return layout.Flex{Alignment: layout.Middle}.Layout(gtx,
          						layout.Flexed(1, func(gtx layout.Context) layout.Dimensions {
          							label := material.Body1(u.th, name)
          							label.Color = uiText
          							label.TextSize = unit.Sp(13)
          							return label.Layout(gtx)
          						}),
          						layout.Rigid(pill(u.th, state, bg, fg)),
          						layout.Rigid(func(gtx layout.Context) layout.Dimensions { return layout.Spacer{Width: unit.Dp(10)}.Layout(gtx) }),
          						layout.Rigid(v2ServerToggle(button, exposed)),
          					)
          				}))(gtx)
          			})
          		}),
          	)
          }
          EOF

          cat > internal/v2config/tool_visibility_test.go <<'EOF'
          package v2config

          import "testing"

          func testToolVisibilityServer() ServerEntry {
          	return ServerEntry{
          		ID:   "srv_00000000000000000000000000000001",
          		Name: "tools",
          		Mode: ModeManaged,
          		Transport: TransportConfig{Type: TransportStdio, Stdio: &StdioTransport{Executable: "test-mcp"}},
          	}
          }

          func TestServerToolVisibility(t *testing.T) {
          	entry := testToolVisibilityServer()
          	if !entry.ToolExposed("alpha") {
          		t.Fatal("tools must be exposed by default")
          	}
          	entry.ToolVisibility.Hidden = []string{"alpha"}
          	if entry.ToolExposed("alpha") || !entry.ToolExposed("beta") {
          		t.Fatal("hidden tool filtering is incorrect")
          	}
          	if err := ValidateServer(entry); err != nil {
          		t.Fatalf("valid hidden tool rejected: %v", err)
          	}
          	entry.ToolVisibility.Hidden = []string{"alpha", "alpha"}
          	if err := ValidateServer(entry); err == nil {
          		t.Fatal("duplicate hidden tools must be rejected")
          	}
          	entry.ToolVisibility.Hidden = []string{" alpha"}
          	if err := ValidateServer(entry); err == nil {
          		t.Fatal("untrimmed hidden tools must be rejected")
          	}
          }
          EOF

          cat > cmd/tunnel-manager/desktop_v2_tool_visibility_test.go <<'EOF'
          //go:build !nogui

          package main

          import (
          	"os"
          	"strings"
          	"testing"
          )

          func TestV2ServerCardsShowToolsAndVisibilityEditor(t *testing.T) {
          	pages, err := os.ReadFile("desktop_v2_pages.go")
          	if err != nil { t.Fatal(err) }
          	text := string(pages)
          	for _, marker := range []string{"KnownServerToolCounts", "%d tools", "actions.tools", "openV2ToolVisibilityEditor", "&actions.tools, \"≡\""} {
          		if !strings.Contains(text, marker) { t.Fatalf("missing server tool UI marker %q", marker) }
          	}
          	if strings.Contains(text, "active leases") { t.Fatal("server card still displays active leases") }

          	editor, err := os.ReadFile("desktop_v2_tool_visibility.go")
          	if err != nil { t.Fatal(err) }
          	editorText := string(editor)
          	for _, marker := range []string{"Tool Exposure", "tools found", "EXPOSED", "HIDDEN", "ToolVisibility.Hidden", "SaveServer"} {
          		if !strings.Contains(editorText, marker) { t.Fatalf("missing tool visibility editor marker %q", marker) }
          	}
          }
          EOF

          gofmt -w \
            internal/v2config/types.go internal/v2config/validate.go internal/v2config/tool_visibility_test.go \
            internal/indexing/service.go internal/routedlifecycle/service.go internal/app/v2_app.go \
            cmd/tunnel-manager/desktop_v2_gio.go cmd/tunnel-manager/desktop_v2_pages.go \
            cmd/tunnel-manager/desktop_v2_tool_visibility.go cmd/tunnel-manager/desktop_v2_tool_visibility_test.go
          git diff --check
          go test ./internal/v2config ./internal/routedlifecycle ./internal/indexing ./internal/app
          go test ./cmd/tunnel-manager

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal cmd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement server tool visibility UI"
          git push origin HEAD:ui/v2-server-tool-visibility
