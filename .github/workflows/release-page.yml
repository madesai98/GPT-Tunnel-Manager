name: Release Page

on:
  push:
    branches:
      - main
    paths:
      - .github/release-page.json
      - .github/release-page.md
      - .github/workflows/release-page.yml
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-page
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update GitHub release page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' .github/release-page.json)"
          TITLE="$(jq -r '.title' .github/release-page.json)"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if [[ -z "$TITLE" || "$TITLE" == "null" ]]; then
            echo "Release title must not be empty" >&2
            exit 1
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "Release $VERSION does not exist yet; it will be updated after the Release workflow completes."
              exit 0
            fi
            echo "Release $VERSION does not exist after the Release workflow completed" >&2
            exit 1
          fi

          gh release edit "$VERSION" \
            --title "$TITLE" \
            --notes-file .github/release-page.md
