name: Normalize server tool visibility diff

on:
  push:
    branches:
      - ui/v2-server-tool-visibility

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'Normalize server tool visibility app methods'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v2-server-tool-visibility
          fetch-depth: 0
      - name: Restore focused app diff
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:internal/app/v2_app.go > /tmp/app.main
          git show HEAD:internal/app/v2_app.go > /tmp/app.branch
          python3 - <<'PY'
          from pathlib import Path
          main = Path('/tmp/app.main').read_text()
          branch = Path('/tmp/app.branch').read_text()
          start = branch.index('func (a *V2App) KnownServerToolNames(')
          end = branch.index('\nfunc (a *V2App) ManagerSnapshot(', start)
          block = branch[start:end]

          # When a live downstream tool list is available, it is authoritative;
          # only use persisted hidden names to reconstruct the full list from a
          # catalog generation that intentionally excludes hidden tools.
          old = '''\tfor _, entry := range a.Entries() {\n\t\tif entry.ID != serverID {\n\t\t\tcontinue\n\t\t}\n\t\tfor _, name := range entry.ToolVisibility.Hidden {\n\t\t\tset[name] = struct{}{}\n\t\t}\n\t\tbreak\n\t}\n'''
          new = '''\tif !live {\n\t\tfor _, entry := range a.Entries() {\n\t\t\tif entry.ID != serverID {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tfor _, name := range entry.ToolVisibility.Hidden {\n\t\t\t\tset[name] = struct{}{}\n\t\t\t}\n\t\t\tbreak\n\t\t}\n\t}\n'''
          if old not in block:
              raise SystemExit('expected hidden-name merge block was not found')
          block = block.replace(old, new, 1)

          anchor = 'func (a *V2App) ManagerSnapshot('
          pos = main.index(anchor)
          Path('internal/app/v2_app.go').write_text(main[:pos] + block + '\n\n' + main[pos:])
          PY
          git diff --check
      - name: Commit app normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/v2_app.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize server tool visibility app methods"
          git push origin HEAD:ui/v2-server-tool-visibility
