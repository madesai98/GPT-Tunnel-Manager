name: Fix v2 server tool visibility workflow

on:
  push:
    branches:
      - ui/v2-server-tool-visibility

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v2-server-tool-visibility
      - name: Fix lifecycle snapshot replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v2-server-tool-visibility.yml')
          text = p.read_text()
          old = """          replace('internal/routedlifecycle/service.go',
              '\\tst.session = connected\\n\\tst.generation++\\n',
              '\\tst.session = connected\\n\\tst.tools = connected.InitialTools().Clone()\\n\\tst.generation++\\n',
              count=3)
"""
          new = """          replace('internal/routedlifecycle/service.go',
              '\\tst.session = connected\\n\\tst.generation++\\n',
              '\\tst.session = connected\\n\\tst.tools = connected.InitialTools().Clone()\\n\\tst.generation++\\n',
              count=2)
          replace('internal/routedlifecycle/service.go',
              '\\t\\tst.session = connected\\n\\t\\tst.generation++\\n',
              '\\t\\tst.session = connected\\n\\t\\tst.tools = connected.InitialTools().Clone()\\n\\t\\tst.generation++\\n')
"""
          if old in text:
              p.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected lifecycle replacement block was not found')
          PY
          git diff --check
      - name: Commit workflow fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v2-server-tool-visibility.yml
          git commit -m "Fix server tool visibility patch workflow"
          git push origin HEAD:ui/v2-server-tool-visibility
