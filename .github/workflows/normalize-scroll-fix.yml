name: Normalize v2 page scrolling fix

on:
  push:
    branches:
      - fix/v2-page-scrolling
    paths:
      - .github/workflows/normalize-scroll-fix.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-page-scrolling
          fetch-depth: 0
      - name: Restore base formatting and apply minimal scrolling patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            cmd/tunnel-manager/desktop_v2_gio.go \
            cmd/tunnel-manager/desktop_v2_index_reviews.go \
            cmd/tunnel-manager/desktop_v2_routing_editor.go \
            cmd/tunnel-manager/desktop_v2_server_editor.go
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          server = "cmd/tunnel-manager/desktop_v2_server_editor.go"
          replace(server,
              "\tsave   widget.Clickable\n\tcancel widget.Clickable\n\tadd    widget.Clickable\n\n\teditRows map[string]*widget.Clickable\n",
              "\tsave   widget.Clickable\n\tcancel widget.Clickable\n\tadd    widget.Clickable\n\n\tscroll   layout.List\n\teditRows map[string]*widget.Clickable\n")
          replace(server,
              "\tv2ServerEditorState.active = true\n\tv2ServerEditorState.editingID = \"\"\n",
              "\tv2ServerEditorState.active = true\n\tv2ServerEditorState.scroll.Position = layout.Position{}\n\tv2ServerEditorState.editingID = \"\"\n")
          replace(server,
              "\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\tvar list layout.List\n\t\t\treturn list.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n",
              "\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\tv2ServerEditorState.scroll.Axis = layout.Vertical\n\t\t\treturn v2ServerEditorState.scroll.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n")

          index = "cmd/tunnel-manager/desktop_v2_index_reviews.go"
          replace(index,
              "var v2IndexReviewState struct {\n\tactions map[string]*v2ReviewActions\n}\n",
              "var v2IndexReviewState struct {\n\tscroll  layout.List\n\tactions map[string]*v2ReviewActions\n}\n")
          replace(index,
              "\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\tvar list layout.List\n\t\t\treturn list.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n",
              "\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\tv2IndexReviewState.scroll.Axis = layout.Vertical\n\t\t\treturn v2IndexReviewState.scroll.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n")

          routing = "cmd/tunnel-manager/desktop_v2_routing_editor.go"
          replace(routing,
              "\ttargetChoices  map[string]*v2RoutingTargetChoice\n\truleActions    map[string]*v2RoutingRuleActions\n\tprofileActions map[string]*v2RoutingProfileActions\n\tinitialized    bool\n",
              "\ttargetChoices  map[string]*v2RoutingTargetChoice\n\truleActions    map[string]*v2RoutingRuleActions\n\tprofileActions map[string]*v2RoutingProfileActions\n\tscroll         layout.List\n\tinitialized    bool\n")
          replace(routing,
              "\tmanager := u.core.ManagerConfig()\n\tvar list layout.List\n\treturn list.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n",
              "\tmanager := u.core.ManagerConfig()\n\tv2RoutingEditorState.scroll.Axis = layout.Vertical\n\treturn v2RoutingEditorState.scroll.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n")

          gio = "cmd/tunnel-manager/desktop_v2_gio.go"
          replace(gio,
              "\tpage string\n\tlist widget.List\n",
              "\tpage           string\n\tlist           widget.List\n\tsettingsScroll layout.List\n")
          replace(gio,
              "\tcredentialStatus := \"not configured\"\n\tif u.core.EmbeddingCredentialConfigured(context.Background()) { credentialStatus = \"configured\" }\n\treturn card(func(gtx layout.Context) layout.Dimensions {\n",
              "\tcredentialStatus := \"not configured\"\n\tif u.core.EmbeddingCredentialConfigured(context.Background()) { credentialStatus = \"configured\" }\n\tu.settingsScroll.Axis = layout.Vertical\n\treturn u.settingsScroll.Layout(gtx, 1, func(gtx layout.Context, _ int) layout.Dimensions {\n\t\treturn card(func(gtx layout.Context) layout.Dimensions {\n")
          replace(gio,
              "\t\t\tlayout.Rigid(func(gtx layout.Context) layout.Dimensions { return v2ProductSettingsSection(u, gtx) }),\n\t\t)\n\t})(gtx)\n}\n\nfunc (u *v2DesktopUI) logsPage",
              "\t\t\tlayout.Rigid(func(gtx layout.Context) layout.Dimensions { return v2ProductSettingsSection(u, gtx) }),\n\t\t)\n\t\t})(gtx)\n\t})\n}\n\nfunc (u *v2DesktopUI) logsPage")
          PY
          git rm .github/workflows/normalize-scroll-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/tunnel-manager
          git commit -m "Keep v2 scrolling fix focused"
          git push origin HEAD:fix/v2-page-scrolling
