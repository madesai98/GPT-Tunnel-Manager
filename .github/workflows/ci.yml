name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Gio Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Verify module graph is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Phase 7 discovery quality gates
        run: go test ./internal/discovery -run '^TestSection18SearchQualityGates$' -v
      - name: Vet
        run: go vet ./...
      - name: Retrieval scale benchmarks
        run: go test ./internal/retrieval -run '^$' -bench 'Benchmark(ExactCosineSearch|LexicalSearch)' -benchmem -benchtime=200ms

  native-gui-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: windows-amd64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Gio Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Report native target
        run: go env GOOS GOARCH
      - name: Build native desktop app (${{ matrix.target }})
        run: go build ./cmd/tunnel-manager
      - name: Test Windows no-console child process configuration
        if: runner.os == 'Windows'
        run: go test ./internal/process
      - name: Test Windows DPAPI secret store
        if: runner.os == 'Windows'
        run: go test ./internal/secrets

  cross-build-headless:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [windows-amd64, windows-arm64, linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build headless-compatible target
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          OS="${TARGET%-*}"
          ARCH="${TARGET#*-}"
          EXT=""
          if [[ "$OS" == windows ]]; then EXT=.exe; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build -tags nogui -trimpath -ldflags='-s -w' -o "dist/tunnel-manager-${OS}-${ARCH}${EXT}" ./cmd/tunnel-manager
