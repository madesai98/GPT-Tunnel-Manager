name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go vet ./...
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-amd64, windows-arm64, linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          OS="${TARGET%-*}"
          ARCH="${TARGET#*-}"
          EXT=""
          if [[ "$OS" == windows ]]; then EXT=.exe; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build -trimpath -ldflags='-s -w' -o "dist/tunnel-manager-${OS}-${ARCH}${EXT}" ./cmd/tunnel-manager
