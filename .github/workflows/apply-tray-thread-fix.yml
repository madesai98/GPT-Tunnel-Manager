name: Apply tray thread fix

on:
  push:
    paths:
      - .github/workflows/apply-tray-thread-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tray threading and hidden restore
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Format and verify
        shell: bash
        run: |
          gofmt -w cmd/tunnel-manager/desktop_gio.go
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/tunnel-manager/desktop_gio.go
          git commit -m "Fix Windows tray message loop"
          git push
