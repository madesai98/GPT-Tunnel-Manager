name: Retry v2 server tool visibility

on:
  push:
    branches:
      - ui/v2-server-tool-visibility

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement server tool visibility UI'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v2-server-tool-visibility
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Gio Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Run corrected implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/v2-server-tool-visibility.yml').read_text()
          start_marker = '      - name: Patch server tool visibility\n        shell: bash\n        run: |\n'
          end_marker = '      - name: Commit implementation\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          if 'count=3)' not in script:
              raise SystemExit('expected original lifecycle replacement count was not found')
          script = script.replace('count=3)', 'count=2)', 1)
          Path('/tmp/visibility-patch.sh').write_text(script)
          PY
          bash /tmp/visibility-patch.sh
          python3 - <<'PY'
          from pathlib import Path

          editor = Path('cmd/tunnel-manager/desktop_v2_tool_visibility.go')
          editor_text = editor.read_text()
          old_tail = '\t\t\t\t}))(gtx)\n\t\t\t})\n'
          new_tail = '\t\t\t\t}))\n\t\t\t})\n'
          if editor_text.count(old_tail) != 1:
              raise SystemExit(f'expected one erroneous editor layout tail, found {editor_text.count(old_tail)}')
          editor.write_text(editor_text.replace(old_tail, new_tail, 1))

          p = Path('internal/routedlifecycle/service.go')
          text = p.read_text()
          old = '\t\tst.session = connected\n\t\tst.generation++\n'
          new = '\t\tst.session = connected\n\t\tst.tools = connected.InitialTools().Clone()\n\t\tst.generation++\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Acquire connection assignment, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/routedlifecycle/service.go cmd/tunnel-manager/desktop_v2_tool_visibility.go
          git diff --check
          go test ./internal/v2config ./internal/routedlifecycle ./internal/indexing ./internal/app
          go test ./cmd/tunnel-manager
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal cmd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement server tool visibility UI"
          git push origin HEAD:ui/v2-server-tool-visibility
