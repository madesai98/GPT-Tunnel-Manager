          replacements = [
              ("\tmessage      string\n\twindowHidden bool\n\texiting      bool", "\tmessage      string\n\twindowHidden bool\n\thidePending  bool\n\texiting      bool"),
              ("\t\tcase gioapp.FrameEvent:\n\t\t\tgtx := gioapp.NewContext(&ops, event)\n\t\t\tu.layout(gtx)\n\t\t\tevent.Frame(gtx.Ops)", "\t\tcase gioapp.FrameEvent:\n\t\t\tgtx := gioapp.NewContext(&ops, event)\n\t\t\tu.layout(gtx)\n\t\t\tevent.Frame(gtx.Ops)\n\t\t\tu.applyPendingHide(win)"),
              ("func (u *desktopUI) showWindow() {\n\tu.mu.RLock()\n\texiting := u.exiting\n\thidden := u.windowHidden\n\twin := u.win\n\tu.mu.RUnlock()", "func (u *desktopUI) showWindow() {\n\tu.mu.Lock()\n\texiting := u.exiting\n\thidden := u.windowHidden\n\twin := u.win\n\tif hidden && u.hidePending && win != nil && !exiting {\n\t\tu.hidePending = false\n\t\tu.windowHidden = false\n\t\thidden = false\n\t}\n\tu.mu.Unlock()"),
              ("func (u *desktopUI) hideToTray() {\n\tu.mu.Lock()\n\tif u.windowHidden || u.exiting || u.win == nil {\n\t\tu.mu.Unlock()\n\t\treturn\n\t}\n\twin := u.win\n\tu.windowHidden = true\n\tu.mu.Unlock()\n\tif hideDesktopWindow() {\n\t\treturn\n\t}\n\twin.Perform(system.ActionClose)\n}\n\nfunc (u *desktopUI) requestClose() {", "func (u *desktopUI) hideToTray() {\n\tu.mu.Lock()\n\tif u.windowHidden || u.exiting || u.win == nil {\n\t\tu.mu.Unlock()\n\t\treturn\n\t}\n\twin := u.win\n\tu.windowHidden = true\n\tu.hidePending = true\n\tu.mu.Unlock()\n\twin.Invalidate()\n}\n\nfunc (u *desktopUI) applyPendingHide(win *gioapp.Window) {\n\tu.mu.Lock()\n\tif !u.hidePending {\n\t\tu.mu.Unlock()\n\t\treturn\n\t}\n\tu.hidePending = false\n\thidden := u.windowHidden\n\texiting := u.exiting\n\tu.mu.Unlock()\n\n\tif !hidden || exiting {\n\t\treturn\n\t}\n\tif hideDesktopWindow() {\n\t\treturn\n\t}\n\tif keepDesktopWindowAliveForTray() {\n\t\tu.mu.Lock()\n\t\tu.windowHidden = false\n\t\tu.message = \"Unable to hide GPT Tunnel Manager to the system tray.\"\n\t\tu.mu.Unlock()\n\t\twin.Invalidate()\n\t\treturn\n\t}\n\twin.Perform(system.ActionClose)\n}\n\nfunc (u *desktopUI) requestClose() {")
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for patch block, got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)

          Path('cmd/tunnel-manager/desktop_window_other.go').write_text('''//go:build !windows && !nogui

package main

func hideDesktopWindow() bool { return false }

func restoreDesktopWindow() bool { return false }

