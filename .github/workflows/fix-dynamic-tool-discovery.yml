name: Fix dynamic downstream tool discovery

on:
  push:
    branches:
      - fix/dynamic-tool-discovery

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Fix dynamic downstream tool discovery' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-tool-discovery
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Gio Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Apply fix
        run: python3 .github/scripts/fix_dynamic_tools.py
      - name: Format and test
        run: |
          gofmt -w internal/downstream/downstream.go internal/downstream/current_tools_test.go internal/routedlifecycle/service.go internal/routedlifecycle/dynamic_tools_test.go
          git diff --check
          go test ./internal/downstream ./internal/routedlifecycle ./internal/indexing ./internal/app
          go test ./cmd/tunnel-manager
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix dynamic downstream tool discovery"
          git push origin HEAD:fix/dynamic-tool-discovery
