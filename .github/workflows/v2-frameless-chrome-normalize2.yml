name: Normalize v2 frameless chrome retry

on:
  push:
    branches:
      - ui/v2-frameless-chrome

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Focus frameless v2 window chrome'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v2-frameless-chrome
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:cmd/tunnel-manager/desktop_v2_gio.go > cmd/tunnel-manager/desktop_v2_gio.go
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cmd/tunnel-manager/desktop_v2_gio.go')
          text = path.read_text()

          def once(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, found {n}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          once('\tth   *material.Theme\n', '\tth   *material.Theme\n\tdeco widget.Decorations\n')
          once(
              '\t\tgioapp.MinSize(unit.Dp(880), unit.Dp(600)),\n\t)\n',
              '\t\tgioapp.MinSize(unit.Dp(880), unit.Dp(600)),\n\t\tgioapp.Decorated(false),\n\t)\n\tu.deco = widget.Decorations{}\n',
          )
          once(
              '\t\tswitch event := win.Event().(type) {\n\t\tcase gioapp.DestroyEvent:\n',
              '\t\tswitch event := win.Event().(type) {\n\t\tcase gioapp.ConfigEvent:\n\t\t\tu.deco.Maximized = event.Config.Mode == gioapp.Maximized\n\t\tcase gioapp.DestroyEvent:\n',
          )
          once(
              '\t\t\tu.mu.RLock()\n\t\t\texiting := u.exiting\n\t\t\tu.mu.RUnlock()\n\t\t\tif exiting {\n',
              '\t\t\tu.mu.RLock()\n\t\t\trequestedHidden := u.windowHidden\n\t\t\texiting := u.exiting\n\t\t\tu.mu.RUnlock()\n\t\t\tif exiting {\n',
          )
          once(
              '\t\t\tselect {\n\t\t\tcase <-u.core.Done():\n\t\t\t\treturn nil\n\t\t\tdefault:\n\t\t\t}\n\t\t\tcfg := u.core.ManagerConfig()\n',
              '\t\t\tselect {\n\t\t\tcase <-u.core.Done():\n\t\t\t\treturn nil\n\t\t\tdefault:\n\t\t\t}\n\t\t\tif requestedHidden {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\tcfg := u.core.ManagerConfig()\n',
          )
          once(
              '''func (u *v2DesktopUI) layout(gtx layout.Context) layout.Dimensions {\n\tpaint.Fill(gtx.Ops, uiCanvas)\n\treturn layout.Flex{Axis: layout.Horizontal}.Layout(gtx,\n\t\tlayout.Rigid(u.sidebar),\n\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\treturn layout.Inset{Top: unit.Dp(24), Bottom: unit.Dp(18), Left: unit.Dp(26), Right: unit.Dp(26)}.Layout(gtx, u.mainArea)\n\t\t}),\n\t)\n}\n''',
              '''func (u *v2DesktopUI) layout(gtx layout.Context) layout.Dimensions {\n\tpaint.Fill(gtx.Ops, uiCanvas)\n\treturn layout.Flex{Axis: layout.Vertical}.Layout(gtx,\n\t\tlayout.Rigid(u.v2TitleBar),\n\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\treturn layout.Flex{Axis: layout.Horizontal}.Layout(gtx,\n\t\t\t\tlayout.Rigid(u.sidebar),\n\t\t\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\t\t\treturn layout.Inset{Top: unit.Dp(24), Bottom: unit.Dp(18), Left: unit.Dp(26), Right: unit.Dp(26)}.Layout(gtx, u.mainArea)\n\t\t\t\t}),\n\t\t\t)\n\t\t}),\n\t)\n}\n''',
          )
          path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('cmd/tunnel-manager/desktop_v2_chrome.go')
          text = p.read_text()
          start = text.index('func (u *v2DesktopUI) perform(action system.Action)')
          end = text.index('func (u *v2DesktopUI) v2TitleBar', start)
          replacement = '''func (u *v2DesktopUI) perform(action system.Action) {\n\tif win := u.currentWindow(); win != nil {\n\t\twin.Perform(action)\n\t}\n}\n\nfunc (u *v2DesktopUI) hideToTray() {\n\tu.mu.Lock()\n\tif u.windowHidden || u.exiting || u.win == nil {\n\t\tu.mu.Unlock()\n\t\treturn\n\t}\n\twin := u.win\n\tu.windowHidden = true\n\tu.mu.Unlock()\n\twin.Perform(system.ActionClose)\n}\n\nfunc (u *v2DesktopUI) requestClose() {\n\tcfg := u.core.ManagerConfig()\n\tif cfg.General.CloseBehavior == "minimize" || cfg.General.MinimizeToTray {\n\t\tu.hideToTray()\n\t\treturn\n\t}\n\tu.requestExit()\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('u.perform(system.ActionClose)', 'u.requestClose()', 1)
          text = text.replace('u.perform(system.ActionMinimize)', 'u.hideToTray()', 1)
          text = text.replace('// Keep the custom chrome as an overlay so the application content still\n\t// starts at the physical top edge of the frameless window, matching v1.', '// Match the final v1 window chrome: an invisible draggable overlay that\n\t// does not consume content height, with the controls at the upper-right.')
          p.write_text(text)

          t = Path('cmd/tunnel-manager/desktop_v2_chrome_test.go')
          test = t.read_text()
          test = test.replace('"system.ActionMinimize",', '"u.requestClose()",\n\t\t"u.hideToTray()",')
          test = test.replace('"layout.Rigid(u.v2TitleBar)",', '"requestedHidden := u.windowHidden",\n\t\t"layout.Rigid(u.v2TitleBar)",')
          t.write_text(test)
          PY

          gofmt -w cmd/tunnel-manager/desktop_v2_chrome.go cmd/tunnel-manager/desktop_v2_chrome_test.go
          git diff --check

      - name: Commit focused chrome patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/tunnel-manager/desktop_v2_gio.go cmd/tunnel-manager/desktop_v2_chrome.go cmd/tunnel-manager/desktop_v2_chrome_test.go
          git commit -m "Focus frameless v2 window chrome"
          git push origin HEAD:ui/v2-frameless-chrome
