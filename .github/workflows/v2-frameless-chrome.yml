name: Apply v2 frameless chrome

on:
  push:
    branches:
      - ui/v2-frameless-chrome

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Restore frameless v2 window chrome'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v2-frameless-chrome
      - name: Patch v2 window chrome
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cmd/tunnel-manager/desktop_v2_gio.go')
          text = path.read_text()

          replacements = [
              (
                  '\tth   *material.Theme\n',
                  '\tth   *material.Theme\n\tdeco widget.Decorations\n',
              ),
              (
                  '\t\tgioapp.MinSize(unit.Dp(880), unit.Dp(600)),\n\t)\n',
                  '\t\tgioapp.MinSize(unit.Dp(880), unit.Dp(600)),\n\t\tgioapp.Decorated(false),\n\t)\n\tu.deco = widget.Decorations{}\n',
              ),
              (
                  '\t\tswitch event := win.Event().(type) {\n\t\tcase gioapp.DestroyEvent:\n',
                  '\t\tswitch event := win.Event().(type) {\n\t\tcase gioapp.ConfigEvent:\n\t\t\tu.deco.Maximized = event.Config.Mode == gioapp.Maximized\n\t\tcase gioapp.DestroyEvent:\n',
              ),
              (
                  '''func (u *v2DesktopUI) layout(gtx layout.Context) layout.Dimensions {\n\tpaint.Fill(gtx.Ops, uiCanvas)\n\treturn layout.Flex{Axis: layout.Horizontal}.Layout(gtx,\n\t\tlayout.Rigid(u.sidebar),\n\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\treturn layout.Inset{Top: unit.Dp(24), Bottom: unit.Dp(18), Left: unit.Dp(26), Right: unit.Dp(26)}.Layout(gtx, u.mainArea)\n\t\t}),\n\t)\n}\n''',
                  '''func (u *v2DesktopUI) layout(gtx layout.Context) layout.Dimensions {\n\tpaint.Fill(gtx.Ops, uiCanvas)\n\treturn layout.Flex{Axis: layout.Vertical}.Layout(gtx,\n\t\tlayout.Rigid(u.v2TitleBar),\n\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\treturn layout.Flex{Axis: layout.Horizontal}.Layout(gtx,\n\t\t\t\tlayout.Rigid(u.sidebar),\n\t\t\t\tlayout.Flexed(1, func(gtx layout.Context) layout.Dimensions {\n\t\t\t\t\treturn layout.Inset{Top: unit.Dp(24), Bottom: unit.Dp(18), Left: unit.Dp(26), Right: unit.Dp(26)}.Layout(gtx, u.mainArea)\n\t\t\t\t}),\n\t\t\t)\n\t\t}),\n\t)\n}\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cat > cmd/tunnel-manager/desktop_v2_chrome.go <<'EOF'
          //go:build !nogui

          package main

          import (
          	"image"
          	"image/color"

          	"gioui.org/io/pointer"
          	"gioui.org/io/system"
          	"gioui.org/layout"
          	"gioui.org/op"
          	"gioui.org/op/clip"
          	"gioui.org/op/paint"
          	"gioui.org/unit"
          	"gioui.org/widget"
          )

          var (
          	v2ChromeClose    widget.Clickable
          	v2ChromeMinimize widget.Clickable
          	v2ChromeMaximize widget.Clickable
          )

          const v2ChromeHeight = unit.Dp(36)

          func v2FillCircle(gtx layout.Context, bounds image.Rectangle, col color.NRGBA) {
          	defer clip.Ellipse(bounds).Push(gtx.Ops).Pop()
          	paint.Fill(gtx.Ops, col)
          }

          func v2TrafficLight(gtx layout.Context, button *widget.Clickable, col color.NRGBA) layout.Dimensions {
          	size := gtx.Dp(unit.Dp(22))
          	gtx.Constraints = layout.Exact(image.Pt(size, size))
          	return button.Layout(gtx, func(gtx layout.Context) layout.Dimensions {
          		dims := layout.Dimensions{Size: image.Pt(size, size)}
          		if button.Hovered() {
          			glow := col
          			glow.A = 72
          			v2FillCircle(gtx, image.Rect(0, 0, size, size), glow)
          			innerGlow := col
          			innerGlow.A = 128
          			inset := gtx.Dp(unit.Dp(2))
          			v2FillCircle(gtx, image.Rect(inset, inset, size-inset, size-inset), innerGlow)
          		}
          		inset := gtx.Dp(unit.Dp(5))
          		v2FillCircle(gtx, image.Rect(inset, inset, size-inset, size-inset), col)
          		return dims
          	})
          }

          func v2ChromeDragRegion(gtx layout.Context) layout.Dimensions {
          	gtx.Constraints.Min = gtx.Constraints.Max
          	dims := layout.Dimensions{Size: gtx.Constraints.Max}
          	stack := clip.Rect{Max: dims.Size}.Push(gtx.Ops)
          	system.ActionInputOp(system.ActionMove).Add(gtx.Ops)
          	pointer.CursorGrab.Add(gtx.Ops)
          	stack.Pop()
          	return dims
          }

          func (u *v2DesktopUI) perform(action system.Action) {
          	if win := u.currentWindow(); win != nil {
          		win.Perform(action)
          	}
          }

          func (u *v2DesktopUI) v2TitleBar(gtx layout.Context) layout.Dimensions {
          	for v2ChromeClose.Clicked(gtx) {
          		u.perform(system.ActionClose)
          	}
          	for v2ChromeMinimize.Clicked(gtx) {
          		u.perform(system.ActionMinimize)
          	}
          	for v2ChromeMaximize.Clicked(gtx) {
          		if u.deco.Maximized {
          			u.perform(system.ActionUnmaximize)
          		} else {
          			u.perform(system.ActionMaximize)
          		}
          	}

          	h := gtx.Dp(v2ChromeHeight)
          	if h > gtx.Constraints.Max.Y {
          		h = gtx.Constraints.Max.Y
          	}
          	if h <= 0 || gtx.Constraints.Max.X <= 0 {
          		return layout.Dimensions{}
          	}

          	red := color.NRGBA{R: 255, G: 95, B: 87, A: 255}
          	yellow := color.NRGBA{R: 254, G: 188, B: 46, A: 255}
          	green := color.NRGBA{R: 40, G: 200, B: 64, A: 255}

          	record := op.Record(gtx.Ops)
          	overlay := gtx
          	overlay.Constraints = layout.Exact(image.Pt(gtx.Constraints.Max.X, h))
          	layout.Flex{Axis: layout.Horizontal}.Layout(overlay,
          		layout.Flexed(1, v2ChromeDragRegion),
          		layout.Rigid(func(gtx layout.Context) layout.Dimensions {
          			return layout.Inset{Right: unit.Dp(10)}.Layout(gtx, func(gtx layout.Context) layout.Dimensions {
          				return layout.Flex{Alignment: layout.Middle}.Layout(gtx,
          					layout.Rigid(func(gtx layout.Context) layout.Dimensions { return v2TrafficLight(gtx, &v2ChromeMinimize, yellow) }),
          					layout.Rigid(func(gtx layout.Context) layout.Dimensions { return layout.Spacer{Width: unit.Dp(4)}.Layout(gtx) }),
          					layout.Rigid(func(gtx layout.Context) layout.Dimensions { return v2TrafficLight(gtx, &v2ChromeMaximize, green) }),
          					layout.Rigid(func(gtx layout.Context) layout.Dimensions { return layout.Spacer{Width: unit.Dp(4)}.Layout(gtx) }),
          					layout.Rigid(func(gtx layout.Context) layout.Dimensions { return v2TrafficLight(gtx, &v2ChromeClose, red) }),
          				)
          			})
          		}),
          	)
          	call := record.Stop()
          	op.Defer(gtx.Ops, call)

          	// Keep the custom chrome as an overlay so the application content still
          	// starts at the physical top edge of the frameless window, matching v1.
          	return layout.Dimensions{}
          }
          EOF

          cat > cmd/tunnel-manager/desktop_v2_chrome_test.go <<'EOF'
          //go:build !nogui

          package main

          import (
          	"os"
          	"strings"
          	"testing"
          )

          func TestV2DesktopRestoresFramelessChrome(t *testing.T) {
          	gioSource, err := os.ReadFile("desktop_v2_gio.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	gioText := string(gioSource)
          	for _, marker := range []string{
          		"gioapp.Decorated(false)",
          		"case gioapp.ConfigEvent:",
          		"u.deco.Maximized = event.Config.Mode == gioapp.Maximized",
          		"layout.Rigid(u.v2TitleBar)",
          	} {
          		if !strings.Contains(gioText, marker) {
          			t.Fatalf("v2 desktop is missing frameless chrome marker %q", marker)
          		}
          	}

          	chromeSource, err := os.ReadFile("desktop_v2_chrome.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	chromeText := string(chromeSource)
          	for _, marker := range []string{
          		"system.ActionInputOp(system.ActionMove)",
          		"system.ActionMinimize",
          		"system.ActionMaximize",
          		"system.ActionUnmaximize",
          		"R: 255, G: 95, B: 87",
          		"R: 254, G: 188, B: 46",
          		"R: 40, G: 200, B: 64",
          		"op.Defer(gtx.Ops, call)",
          	} {
          		if !strings.Contains(chromeText, marker) {
          			t.Fatalf("custom chrome is missing marker %q", marker)
          		}
          	}
          }
          EOF

          gofmt -w cmd/tunnel-manager/desktop_v2_gio.go cmd/tunnel-manager/desktop_v2_chrome.go cmd/tunnel-manager/desktop_v2_chrome_test.go
          git diff --check

      - name: Commit restored v1-style chrome
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/tunnel-manager/desktop_v2_gio.go cmd/tunnel-manager/desktop_v2_chrome.go cmd/tunnel-manager/desktop_v2_chrome_test.go
          git commit -m "Restore frameless v2 window chrome"
          git push origin HEAD:ui/v2-frameless-chrome
