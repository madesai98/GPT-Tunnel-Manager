<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Tunnel Manager</title><style>:root{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#111318;color:#e9edf5}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#181b22;border-bottom:1px solid #303642;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:3}.top h1{font-size:18px;margin:0}.wrap{max-width:1280px;margin:auto;padding:18px}.card{background:#181b22;border:1px solid #303642;border-radius:10px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:#9ca7b8;font-size:12px}.badge{padding:3px 8px;border-radius:999px;background:#29303c;font-size:12px}.ready{background:#173b2d}.bad{background:#4b2525}.warn{background:#4a3d20}button,a.btn{border:1px solid #3b4555;background:#242a34;color:#eef2f7;border-radius:7px;padding:7px 10px;text-decoration:none;cursor:pointer}button.primary{background:#3557d6;border-color:#4968e5}button.danger{background:#6b2929}button:disabled{opacity:.45;cursor:not-allowed}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2c323c;text-align:left;font-size:13px}input,select,textarea{width:100%;background:#101218;border:1px solid #394150;color:#eef2f7;border-radius:6px;padding:8px}label{font-size:12px;color:#bac2cf;display:block;margin:8px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}dialog{background:#181b22;color:#e9edf5;border:1px solid #3b4555;border-radius:10px;width:min(900px,96vw);max-height:92vh;overflow:auto}pre{background:#0d0f14;border:1px solid #2c323c;border-radius:7px;padding:10px;max-height:300px;overflow:auto;font-size:11px;white-space:pre-wrap}.tabs button{margin-right:5px}.hidden{display:none}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}table{display:block;overflow-x:auto}}</style></head><body><div class="top"><h1>GPT Tunnel Manager</h1><div class="row"><button onclick="refresh()">Refresh</button><button onclick="openSettings()">Settings</button><button class="danger" onclick="exitManager()">Exit</button></div></div><div class="wrap"><div id="manager" class="card">Loading…</div><div class="card"><div class="row"><h2 class="grow" style="font-size:16px">Servers</h2><button class="primary" onclick="editServer()">Add Server</button></div><div id="servers"></div></div><div class="card"><div class="row"><h2 class="grow" style="font-size:16px">Live Console</h2><select id="logLevel" style="width:120px" onchange="renderLogs()"><option value="">All levels</option><option>info</option><option>warn</option><option>error</option><option>debug</option><option>trace</option></select><input id="logSearch" style="width:220px" placeholder="Search" oninput="renderLogs()"><a class="btn" href="/api/logs?format=text" target="_blank">Text</a><a class="btn" href="/api/logs?format=jsonl" target="_blank">JSONL</a><button onclick="clearLogs()">Clear</button></div><pre id="logs"></pre></div></div><dialog id="serverDlg"><form method="dialog" onsubmit="event.preventDefault();saveServer()"><div class="row"><h3 class="grow">Server Entry</h3><button type="button" onclick="serverDlg.close()">Close</button></div><input id="sid" type="hidden"><div class="grid"><div><label>Name</label><input id="sname" required></div><div><label>ChatGPT Developer Plugin name</label><input id="splugin"></div><div><label>Mode</label><select id="smode"><option value="managed">Managed</option><option value="always_on">Always On</option><option value="manual">Manual</option></select></div><div><label>Enabled</label><select id="senabled"><option value="true">Enabled</option><option value="false">Disabled</option></select></div><div><label>Transport</label><select id="stransport" onchange="transportChanged()"><option value="stdio">Stdio</option><option value="managed_http">Managed HTTP</option><option value="external_http">External HTTP</option></select></div><div><label>Tunnel ID</label><input id="stunnel" placeholder="tunnel_..."></div><div><label>Runtime credential ref (blank = global)</label><input id="scred" placeholder="secret://openai/runtime/default"></div><div><label>Idle timeout seconds (blank = global)</label><input id="sidle" type="number" min="0"></div></div><div id="launchFields"><div class="grid"><div><label>Executable</label><input id="sexe"></div><div><label>Working directory</label><input id="scwd"></div></div><label>Arguments (one per line)</label><textarea id="sargs" rows="4"></textarea></div><div id="urlFields" class="hidden"><label>MCP URL</label><input id="surl" placeholder="http://127.0.0.1:9000/mcp"></div><div class="grid"><div><label>Environment values (KEY=value, one per line)</label><textarea id="senv" rows="4"></textarea></div><div><label>Secret environment refs (KEY=secret://..., one per line)</label><textarea id="ssecrets" rows="4"></textarea></div><div><label>Startup timeout seconds</label><input id="sstart" type="number" min="0" value="30"></div><div><label>Shutdown timeout seconds</label><input id="sstop" type="number" min="0" value="10"></div></div><div class="row" style="margin-top:14px"><button type="button" onclick="copyMarker()">Copy Lifecycle Marker</button><button class="primary" type="submit">Save</button></div></form></dialog><dialog id="settingsDlg"><form method="dialog" onsubmit="event.preventDefault();saveSettings()"><div class="row"><h3 class="grow">Settings</h3><button type="button" onclick="settingsDlg.close()">Close</button></div><div class="grid"><div><label>Manager Tunnel ID</label><input id="mtunnel"></div><div><label>Runtime credential ref</label><input id="mcred" placeholder="secret://openai/runtime/default"></div><div><label>Default managed idle timeout seconds</label><input id="midle" type="number" min="0"></div><div><label>Launch at startup</label><select id="mlaunch"><option value="false">Off</option><option value="true">On</option></select></div><div><label>Close behavior</label><select id="mclose"><option value="minimize">Keep running</option><option value="exit">Exit</option></select></div><div><label>Confirm exit</label><select id="mconfirm"><option value="true">On</option><option value="false">Off</option></select></div><div><label>Auto-update tunnel-client</label><select id="mauto"><option value="true">On</option><option value="false">Off</option></select></div><div><label>Theme</label><select id="mtheme"><option>system</option><option>dark</option><option>light</option></select></div><div><label>Disk logging</label><select id="mdisk"><option value="false">Off</option><option value="true">On</option></select></div></div><hr style="border-color:#303642"><h4>Secrets</h4><div class="row"><input id="secretRef" placeholder="secret://openai/runtime/default" class="grow"><input id="secretValue" type="password" placeholder="Secret value" class="grow"><button type="button" onclick="saveSecret()">Store Secret</button></div><hr style="border-color:#303642"><h4>Setup & Updates</h4><div class="row"><a class="btn" target="_blank" href="https://platform.openai.com/settings/organization/tunnels">Create / Manage Tunnels</a><a class="btn" target="_blank" href="https://platform.openai.com/settings/organization/api-keys">Create Runtime API Key</a><a class="btn" target="_blank" href="https://chatgpt.com/#settings/Plugins">Open ChatGPT Developer Plugins</a><button type="button" onclick="checkUpdate()">Check Update</button><button type="button" onclick="installUpdate()">Install Latest</button><button type="button" onclick="rollback()">Roll Back</button></div><div class="row" style="margin-top:14px"><button class="primary" type="submit">Save Settings</button></div></form></dialog><script>let state=null,logs=[];const $=id=>document.getElementById(id);async function req(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):{};}async function refresh(){try{state=await req('/api/state');logs=await req('/api/logs');render();}catch(e){alert(e.message)}}function render(){const m=state.manager_config,mt=state.manager_tunnel||{};$('manager').innerHTML=`<div class="row"><div class="grow"><b>Manager Tunnel</b><div class="muted">${m.manager_tunnel.tunnel_id||'Not configured'}</div></div><span class="badge ${mt.ready?'ready':'warn'}">${mt.state||'stopped'}</span><div><b>tunnel-client</b><div class="muted">${state.tunnel_client?.installed||'not installed'}</div></div><div><b>Manager MCP</b><div class="muted">${state.manager_mcp_url||''}</div></div></div>`;let by={};for(const x of state.snapshots||[])by[x.server_id]=x;let h='<table><thead><tr><th>Name</th><th>Mode</th><th>State</th><th>Tunnel</th><th>Activity</th><th>Actions</th></tr></thead><tbody>';for(const e of state.entries||[]){const x=by[e.id]||{};const cls=x.ready?'ready':x.observed_state==='degraded'?'bad':'warn';h+=`<tr><td><b>${esc(e.name)}</b><div class="muted">${e.id}</div></td><td>${e.mode}${e.enabled?'':' (disabled)'}</td><td><span class="badge ${cls}">${x.observed_state||'stopped'}</span></td><td>${x.tunnel_ready?'Ready':'—'}</td><td>${x.activity_tracking||'unknown'}</td><td><div class="row"><button onclick="life('${e.id}','start')">Start</button><button onclick="life('${e.id}','shutdown')">Stop</button><button onclick="life('${e.id}','restart')">Restart</button><button onclick="editServer('${e.id}')">Edit</button><button onclick="copyText(marker('${e.id}'))">Marker</button><button class="danger" onclick="delServer('${e.id}')">Delete</button></div></td></tr>`}h+='</tbody></table>';$('servers').innerHTML=h;renderLogs()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function marker(id){return `Managed by GPT Tunnel Manager.\nGTM_SERVER_ID=${id}\nFollow the GPT Tunnel Manager Lifecycle Skill before using this plugin.`}async function copyText(t){await navigator.clipboard.writeText(t)}async function life(id,a){try{await req(`/api/lifecycle/${id}/${a}`,{method:'POST'});await refresh()}catch(e){alert(e.message)}}async function delServer(id){if(!confirm('Delete this Server Entry and stop its owned runtime?'))return;try{await req('/api/server?id='+encodeURIComponent(id),{method:'DELETE'});await refresh()}catch(e){alert(e.message)}}function linesMap(v){let o={};for(const l of v.split('\n')){const i=l.indexOf('=');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1)}return o}function mapLines(o){return Object.entries(o||{}).map(([k,v])=>k+'='+v).join('\n')}function transportChanged(){const t=$('stransport').value;$('launchFields').classList.toggle('hidden',t==='external_http');$('urlFields').classList.toggle('hidden',t==='stdio')}function editServer(id){const e=id?(state.entries||[]).find(x=>x.id===id):null;$('sid').value=e?.id||'';$('sname').value=e?.name||'';$('splugin').value=e?.chatgpt_plugin_name||'';$('smode').value=e?.mode||'managed';$('senabled').value=String(e?.enabled??true);$('stunnel').value=e?.tunnel?.tunnel_id||'';$('scred').value=e?.tunnel?.runtime_credential_ref||'';$('sidle').value=e?.runtime?.idle_timeout_seconds??'';$('sstart').value=e?.runtime?.startup_timeout_seconds||30;$('sstop').value=e?.runtime?.shutdown_timeout_seconds||10;$('senv').value=mapLines(e?.environment?.values);$('ssecrets').value=mapLines(e?.environment?.secret_refs);const t=e?.transport?.type||'stdio';$('stransport').value=t;let launch=t==='stdio'?e?.transport?.stdio:e?.transport?.managed_http?.launch;$('sexe').value=launch?.executable||'';$('scwd').value=launch?.working_directory||'';$('sargs').value=(launch?.args||[]).join('\n');$('surl').value=t==='managed_http'?e?.transport?.managed_http?.url||'':e?.transport?.external_http?.url||'';transportChanged();serverDlg.showModal()}async function saveServer(){const t=$('stransport').value,args=$('sargs').value.split('\n').map(x=>x.trim()).filter(Boolean),launch={executable:$('sexe').value.trim(),args,working_directory:$('scwd').value.trim()};let tr={type:t};if(t==='stdio')tr.stdio=launch;else if(t==='managed_http')tr.managed_http={url:$('surl').value.trim(),launch};else tr.external_http={url:$('surl').value.trim()};const idle=$('sidle').value;const e={id:$('sid').value,name:$('sname').value.trim(),chatgpt_plugin_name:$('splugin').value.trim(),enabled:$('senabled').value==='true',mode:$('smode').value,transport:tr,tunnel:{tunnel_id:$('stunnel').value.trim(),runtime_credential_ref:$('scred').value.trim()},environment:{values:linesMap($('senv').value),secret_refs:linesMap($('ssecrets').value)},runtime:{startup_timeout_seconds:+$('sstart').value||30,shutdown_timeout_seconds:+$('sstop').value||10,idle_timeout_seconds:idle===''?null:+idle},logging:{capture_level_override:null}};try{await req('/api/server',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});serverDlg.close();await refresh()}catch(e){alert(e.message)}}function copyMarker(){const id=$('sid').value;if(!id)return alert('Save the server first to generate its immutable Server ID.');copyText(marker(id))}function openSettings(){const m=state.manager_config;$('mtunnel').value=m.manager_tunnel.tunnel_id||'';$('mcred').value=m.manager_tunnel.runtime_credential_ref||'';$('midle').value=m.managed_defaults.idle_timeout_seconds;$('mlaunch').value=String(m.general.launch_at_startup);$('mclose').value=m.general.close_behavior;$('mconfirm').value=String(m.general.confirm_exit);$('mauto').value=String(m.tunnel_client.auto_update);$('mtheme').value=m.appearance.theme;$('mdisk').value=String(m.logging.write_to_disk);settingsDlg.showModal()}async function saveSettings(){const m=structuredClone(state.manager_config);m.manager_tunnel={tunnel_id:$('mtunnel').value.trim(),runtime_credential_ref:$('mcred').value.trim()};m.managed_defaults.idle_timeout_seconds=+$('midle').value||0;m.general.launch_at_startup=$('mlaunch').value==='true';m.general.close_behavior=$('mclose').value;m.general.confirm_exit=$('mconfirm').value==='true';m.tunnel_client.auto_update=$('mauto').value==='true';m.appearance.theme=$('mtheme').value;m.logging.write_to_disk=$('mdisk').value==='true';try{await req('/api/manager',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m)});settingsDlg.close();await refresh()}catch(e){alert(e.message)}}async function saveSecret(){try{await req('/api/secret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:$('secretRef').value.trim(),value:$('secretValue').value})});$('secretValue').value='';alert('Secret stored.')}catch(e){alert(e.message)}}async function checkUpdate(){try{const x=await req('/api/update/check',{method:'POST'});alert('Latest: '+x.tag_name)}catch(e){alert(e.message)}}async function installUpdate(){if(!confirm('Install the latest tunnel-client for future starts/restarts?'))return;try{const x=await req('/api/update/install',{method:'POST'});alert('Installed '+x.version);await refresh()}catch(e){alert(e.message)}}async function rollback(){if(!confirm('Roll back tunnel-client for future starts/restarts?'))return;try{const x=await req('/api/update/rollback',{method:'POST'});alert('Active '+x.version);await refresh()}catch(e){alert(e.message)}}function renderLogs(){const level=$('logLevel')?.value||'',q=($('logSearch')?.value||'').toLowerCase();const xs=logs.filter(x=>(!level||x.level===level)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).slice(-1000);$('logs').textContent=xs.map(x=>`${x.timestamp} ${String(x.level).toUpperCase().padEnd(5)} ${x.source} ${x.component}: ${x.message}`).join('\n');$('logs').scrollTop=$('logs').scrollHeight}async function clearLogs(){await req('/api/logs',{method:'DELETE'});logs=[];renderLogs()}async function exitManager(){const c=state?.manager_config?.general?.confirm_exit;if(c&&!confirm('Exit GPT Tunnel Manager?\n\nThis will disconnect all tunnels and stop all MCP servers currently owned by Tunnel Manager.'))return;await req('/api/exit',{method:'POST'});document.body.innerHTML='<div class="wrap"><div class="card">GPT Tunnel Manager is shutting down.</div></div>'}refresh();setInterval(async()=>{try{state=await req('/api/state');logs=await req('/api/logs');render()}catch{}},3000);</script></body></html>
